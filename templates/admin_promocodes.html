{% extends "base.html" %}
{% from "_macros.html" import admin_nav %}
{% block title %}Промокоди{% endblock %}
{% block content %}
{{ admin_nav('promocodes') }}
<h1 class="mb-5 text-2xl font-bold">Промокоди</h1>
<table>
    <thead>
        <tr>
            <th>Код</th>
            <th>% / сума</th>
            <th>Мінімальне замовлення</th>
            <th>Діє до</th>
            <th>Активний</th>
            <th>Дії</th>
        </tr>
    </thead>

    <tbody id="promocodes"></tbody>
</table>

<form id="promocodeForm">
    <input name="code" maxlength="50" required>

    <input name="discount_percent"
           type="number" min="0" max="100" step="0.01">

    <input name="discount_amount"
           type="number" min="0" step="0.01">

    <input name="min_order"
           type="number" min="0" step="0.01">

    <input name="expires_at" type="date">

    <label>
        <input name="active" type="checkbox" checked>
        Активний
    </label>

    <button type="submit">Створити</button>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin-promocodes.js') }}"></script>
{% endblock %}
