{% extends "base.html" %}

{% block title %}Мій кошик{% endblock %}

{% block content %}
<h1 class="mb-5 text-2xl font-bold">Кошик</h1>

<div id="emptyCart" hidden
     class="rounded-xl bg-white/30 p-5">
    Кошик порожній.
    <a href="{{ url_for('shop.shop') }}"
       class="text-accent underline">
        Перейти до магазину
    </a>
</div>

<div id="cartLines" class="space-y-3"></div>

<div id="summary"
     class="my-5 text-xl font-bold">
</div>

<form id="promoForm"
      class="mb-6 flex flex-wrap gap-3">

    <input name="code"
           placeholder="Промокод"
           class="rounded-lg border border-line bg-white px-3 py-2">

    <button type="submit"
            class="rounded-lg bg-accent px-4 py-2 text-white">
        Застосувати
    </button>
</form>

<form id="checkoutForm"
      class="space-y-4 border-t border-line pt-5">

    <h2 class="text-xl font-semibold">
        Оформлення замовлення
    </h2>

    <div>
        <label>Email</label>
        <input name="email"
               type="email"
               required
               class="block w-full rounded-lg border border-line bg-white px-3 py-2">
        <p data-error="email" class="text-red-700"></p>
    </div>

    <div>
        <label>Адреса доставки</label>
        <input name="address"
               maxlength="300"
               required
               class="block w-full rounded-lg border border-line bg-white px-3 py-2">
        <p data-error="address" class="text-red-700"></p>
    </div>

    <button type="submit"
            class="rounded-lg bg-accent px-5 py-3 text-white">
        Оформити замовлення
    </button>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cart-page.js') }}"></script>
{% endblock %}
