{% extends "base.html" %}
{% block title %}{{ 'Новий товар' if is_new else 'Редагування товару' }}{% endblock %}
{% block content %}
<h1 class="mb-5 text-2xl font-bold">
    {{ 'Новий товар' if is_new else 'Редагування товару' }}
</h1>

<form id="productForm"
      data-product-id="{{ product_id or '' }}"
      class="space-y-4">

    <div>
        <label>Назва</label>

        <input name="name"
               maxlength="100"
               required
               class="block w-full rounded-lg border border-line bg-white p-2">
    </div>

    <div>
        <label>Ціна</label>

        <input name="price"
               type="number"
               min="0"
               step="0.01"
               required
               class="block w-full rounded-lg border border-line bg-white p-2">
    </div>

    <div>
        <label>Знижка (%)</label>

        <input name="discount_percent"
               type="number"
               min="0"
               max="100"
               value="0"
               class="block w-full rounded-lg border border-line bg-white p-2">
    </div>

    <div>
        <label>Категорія</label>

        <select name="category_id"
                class="block w-full rounded-lg border border-line bg-white p-2">

            <option value="">Без категорії</option>
        </select>
    </div>

    <div>
        <label>URL зображення</label>

        <input name="image"
               maxlength="500"
               class="block w-full rounded-lg border border-line bg-white p-2">
    </div>

    <div>
        <label>Завантажити файл</label>

        <input name="image_file"
               type="file"
               accept=".jpg,.jpeg,.png,.gif,.webp">

        <img id="imagePreview"
             class="mt-3 max-h-48 object-contain"
             alt="Прев'ю">
    </div>

    <div id="formErrors" class="text-red-700"></div>

    <button type="submit"
            class="rounded-lg bg-accent px-5 py-2 text-white">
        Зберегти
    </button>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/product-form.js') }}" defer></script>
{% endblock %}
