{% extends "base.html" %}
{% from "_macros.html" import admin_nav %}

{% block title %}Адмін-панель{% endblock %}

{% block content %}

{{ admin_nav('orders') }}

<h1 class="mb-5 text-2xl font-bold">
    Адмін-панель
</h1>

<div id="statistics"
     class="mb-5 grid grid-cols-2 gap-4">
</div>

<h2 class="mb-3 text-xl font-bold">
    Замовлення
</h2>

<select id="statusFilter"
        class="mb-4 rounded-lg border border-line bg-white p-2">

    <option value="">Усі</option>
    <option>Нове</option>
    <option>В обробці</option>
    <option>Відправлено</option>
    <option>Доставлено</option>
    <option>Скасовано</option>
</select>

<div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
        <thead>
            <tr class="border-b border-line">
                <th class="p-3">№</th>
                <th class="p-3">Email</th>
                <th class="p-3">Сума</th>
                <th class="p-3">Статус</th>
                <th class="p-3">Дата</th>
                <th class="p-3">Дії</th>
            </tr>
        </thead>

        <tbody id="orders"></tbody>
    </table>
</div>

<h2 class="mb-4 mt-8 text-xl font-bold">
    Відгуки
</h2>

<div id="feedbackList"
     class="grid grid-cols-1 gap-4 lg:grid-cols-2">
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
