{% extends "base.html" %}
{% block title %}Магазин{% endblock %}
{% block content %}
<h1 class="mb-5 text-2xl font-bold">Магазин</h1>

<form id="filterForm"
      class="mb-6 grid grid-cols-1 gap-3 rounded-xl border border-line bg-white/20 p-4 md:grid-cols-6">

    <input name="q"
           placeholder="Пошук товару"
           class="rounded-lg border border-line bg-white px-3 py-2 md:col-span-2">

    <select name="category"
            class="rounded-lg border border-line bg-white px-3 py-2">
        <option value="">Усі категорії</option>
    </select>

    <input name="min_price"
           type="number"
           min="0"
           step="0.01"
           placeholder="Ціна від"
           class="rounded-lg border border-line bg-white px-3 py-2">

    <input name="max_price"
           type="number"
           min="0"
           step="0.01"
           placeholder="Ціна до"
           class="rounded-lg border border-line bg-white px-3 py-2">

    <select name="sort"
            class="rounded-lg border border-line bg-white px-3 py-2">
        <option value="id">Спочатку нові</option>
        <option value="price">Дешевші</option>
        <option value="price_desc">Дорожчі</option>
        <option value="name">За назвою</option>
        <option value="new">Нові</option>
    </select>

    <label class="flex items-center gap-2">
        <input type="checkbox" name="on_sale">
        Лише зі знижкою
    </label>

    <button type="submit"
            class="rounded-lg bg-accent px-4 py-2 text-white">
        Знайти
    </button>

    <button type="reset"
            class="rounded-lg border border-line px-4 py-2">
        Скинути
    </button>
</form>

<div id="products"
     class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
</div>

<div id="pagination"
     class="mt-6 flex flex-wrap justify-center gap-2">
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/shop.js') }}"></script>
{% endblock %}
