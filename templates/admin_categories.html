{% extends "base.html" %}
{% from "_macros.html" import admin_nav %}

{% block title %}Категорії{% endblock %}

{% block content %}

{{ admin_nav('categories') }}

<h1 class="mb-5 text-2xl font-bold">
    Категорії товарів
</h1>

<form id="categoryForm"
      class="mb-6 flex flex-wrap items-end gap-3 rounded-xl border border-line bg-white/20 p-4">

    <label class="grow">
        <span class="mb-1 block text-sm font-medium">
            Назва
        </span>

        <input name="name"
               maxlength="100"
               required
               class="w-full rounded-lg border border-line bg-white px-3 py-2">
    </label>

    <label>
        <span class="mb-1 block text-sm font-medium">
            Батьківська категорія
        </span>

        <select name="parent_id"
                class="rounded-lg border border-line bg-white px-3 py-2">

            <option value="">
                Коренева категорія
            </option>

        </select>
    </label>

    <button type="submit"
            class="rounded-lg bg-accent px-4 py-2 text-white">
        Додати
    </button>
</form>

<div id="categories" class="space-y-2"></div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin-categories.js') }}"></script>
{% endblock %}
