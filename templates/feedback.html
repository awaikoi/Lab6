{% extends "base.html" %}
{% block title %}Зворотний зв'язок{% endblock %}
{% block content %}
<h1 class="mb-4 text-3xl font-bold">Зворотний зв'язок</h1>

<form id="feedbackForm" class="space-y-4">

    <div>
        <label>Ім'я</label>
        <input name="name"
               maxlength="100"
               required
               class="block w-full rounded-lg border border-line bg-white p-2">

        <p data-error="name" class="text-red-700"></p>
    </div>

    <div>
        <label>Email</label>
        <input name="email"
               type="email"
               required
               class="block w-full rounded-lg border border-line bg-white p-2">

        <p data-error="email" class="text-red-700"></p>
    </div>

    <div>
        <label>Повідомлення</label>
        <textarea name="message"
                  maxlength="2000"
                  required
                  class="block w-full rounded-lg border border-line bg-white p-2"></textarea>

        <p data-error="message" class="text-red-700"></p>
    </div>

    <button type="submit"
            class="rounded-lg bg-accent px-5 py-2 text-white">
        Надіслати
    </button>

</form>

<!-- Модальне вікно -->
<div id="thankYouModal" class="fixed inset-0 hidden h-full w-full overflow-y-auto bg-gray-600/50" role="dialog" aria-modal="true" aria-labelledby="thankYouTitle">
    <div class="relative top-20 mx-auto w-96 max-w-[90%] rounded-md border bg-white p-5 shadow-lg">
        <div class="mt-3 text-center">
            <h3 id="thankYouTitle" class="text-lg font-medium text-gray-900">Дякуємо за ваш відгук!</h3>
            <p class="mt-2 px-7 py-3 text-sm text-gray-500">Ми цінуємо ваш час та увагу.</p>
            <button id="closeModal" type="button" class="w-full rounded-md bg-blue-600 px-4 py-2 text-base font-medium text-white shadow-md hover:bg-blue-700">Закрити</button>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('feedbackForm');
    const modal = document.getElementById('thankYouModal');
    const errorBox = document.getElementById('formError');

    function showError(text) {
        errorBox.textContent = text;
        errorBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();  // не перезавантажуємо сторінку — надсилаємо дані через fetch
        errorBox.classList.add('hidden');
        try {
            const response = await fetch("{{ url_for('feedback.feedback') }}", {
                method: 'POST',
                body: new FormData(form),
            });
            const data = await response.json();
            if (response.ok) {
                modal.classList.remove('hidden');
                form.reset();
            } else {
                showError(data.error || 'Не вдалося надіслати відгук. Спробуйте ще раз.');
            }
        } catch (error) {
            showError('Не вдалося зв\'язатися із сервером. Спробуйте ще раз.');
        }
    });

    document.getElementById('closeModal').addEventListener('click', () => modal.classList.add('hidden'));
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/feedback.js') }}"></script>
{% endblock %}
