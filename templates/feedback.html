{% extends "base.html" %}
{% block title %}Зворотний зв'язок{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
    <header class="mb-6 text-center">
        <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-accent">На зв'язку</p>
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Зворотний зв'язок</h1>
        <p class="mt-3 text-sm text-ink/55">Напишіть нам — ми уважно розглянемо ваше повідомлення.</p>
    </header>

    <form id="feedbackForm" class="rounded-2xl border border-line bg-surface p-5 shadow-[var(--shadow-sm)] sm:p-7">
        <p id="formError" class="mb-4 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
        <div class="space-y-5">
            <div>
                <label class="mb-1.5 block text-sm font-semibold">Ім'я</label>
                <input name="name" maxlength="100" required
                       class="block w-full rounded-xl border border-line bg-[#fbfaf8] px-3 py-3">
                <p data-error="name" class="mt-1 text-sm text-red-700"></p>
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-semibold">Email</label>
                <input name="email" type="email" required
                       class="block w-full rounded-xl border border-line bg-[#fbfaf8] px-3 py-3">
                <p data-error="email" class="mt-1 text-sm text-red-700"></p>
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-semibold">Повідомлення</label>
                <textarea name="message" maxlength="2000" required rows="5"
                          class="block w-full resize-y rounded-xl border border-line bg-[#fbfaf8] px-3 py-3"></textarea>
                <p data-error="message" class="mt-1 text-sm text-red-700"></p>
            </div>
            <button type="submit" class="w-full rounded-xl bg-accent px-5 py-3.5 text-sm font-bold text-white">
                Надіслати повідомлення
            </button>
        </div>
    </form>
</div>

<!-- Модальне вікно -->
<div id="thankYouModal" class="fixed inset-0 hidden h-full w-full overflow-y-auto bg-gray-600/50" role="dialog" aria-modal="true" aria-labelledby="thankYouTitle">
    <div class="relative top-20 mx-auto w-96 max-w-[90%] rounded-md border bg-white p-5 shadow-lg">
        <div class="mt-3 text-center">
            <h3 id="thankYouTitle" class="text-lg font-medium text-gray-900">Дякуємо за ваш відгук!</h3>
            <p class="mt-2 px-7 py-3 text-sm text-gray-500">Ми цінуємо ваш час та увагу.</p>
            <button id="closeModal" type="button" class="w-full rounded-md bg-blue-600 px-4 py-2 text-base font-medium text-white shadow-md hover:bg-blue-700">Закрити</button>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('feedbackForm');
    const modal = document.getElementById('thankYouModal');
    const errorBox = document.getElementById('formError');

    function showError(text) {
        errorBox.textContent = text;
        errorBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();  // не перезавантажуємо сторінку — надсилаємо дані через fetch
        errorBox.classList.add('hidden');
        try {
            const response = await fetch("{{ url_for('feedback.feedback') }}", {
                method: 'POST',
                body: new FormData(form),
            });
            const data = await response.json();
            if (response.ok) {
                modal.classList.remove('hidden');
                form.reset();
            } else {
                showError(data.error || 'Не вдалося надіслати відгук. Спробуйте ще раз.');
            }
        } catch (error) {
            showError('Не вдалося зв\'язатися із сервером. Спробуйте ще раз.');
        }
    });

    document.getElementById('closeModal').addEventListener('click', () => modal.classList.add('hidden'));
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/feedback.js') }}"></script>
{% endblock %}
